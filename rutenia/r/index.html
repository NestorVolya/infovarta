<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Рутенія: робочий індекс</title>
<style>
@font-face{font-family:"Rutenia Arial";src:url("../../fonts/RuteniaArial2009-Regular.woff") format("woff");font-display:swap}
@font-face{font-family:"Ruthenia Rada Text";src:url("../../fonts/RutheniaRadaText-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Ruthenia Rada";src:url("../../fonts/RutheniaRada-Regular.woff2") format("woff2");font-display:swap}
:root{--paper:#F5F0E6;--ink:#1A1816;--ink-muted:#5E5850;--accent:#A32A1F;--rule:#D8CFBF;
  --body:"Rutenia Arial","Ruthenia Rada Text",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141311;--ink:#ECE6DA;--ink-muted:#A39C90;--accent:#D9574A;--rule:#3A3631;color-scheme:dark}}
:root[data-font="rada"]{--body:"Ruthenia Rada Text",serif}
*{box-sizing:border-box}
html{font-synthesis:none}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.55 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:40px clamp(16px,4vw,48px) 104px}
header{display:grid;gap:16px;border-bottom:1px solid var(--rule);padding-bottom:24px}
h1{font:400 clamp(32px,5vw,52px)/1.05 "Ruthenia Rada",serif;margin:0}
.lede{color:var(--ink-muted);margin:0;max-width:66ch;font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sw button,.st button{letter-spacing:.04em;color:var(--ink-muted);padding:4px 0;border-bottom:1px solid transparent}
.sw button[aria-pressed=true],.st button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
.sw,.st{display:flex;gap:14px;align-items:center}
.lbl{color:var(--ink-muted);font-size:14px}
input[type=search],input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:6px 0;min-width:0;flex:1 1 240px;border-radius:0}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav{display:flex;flex-wrap:wrap;gap:4px 22px;margin:24px 0 8px;border-bottom:1px solid var(--rule)}
nav button{padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:17px;color:var(--ink-muted)}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav button small{font-size:13px;margin-left:4px;color:var(--ink-muted)}
h2{font:400 15px/1.3 "Ruthenia Rada",serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:40px 0 4px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 24px;padding:14px 0;border-bottom:1px solid var(--rule)}
li a{color:var(--ink);text-decoration:none;font-size:19px}
li a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--ink-muted)}
.s{font-size:14px;color:var(--ink-muted);text-align:right;white-space:nowrap}
.s.on{color:var(--accent)}
.n{grid-column:1/-1;font-size:15px;color:var(--ink-muted);margin:0}
.lock{color:var(--accent);font-size:.6em;vertical-align:.25em}
.empty{color:var(--ink-muted);padding:24px 0}
.gate{max-width:480px;margin:15vh auto 0;display:grid;gap:16px}
.gate form{display:flex;gap:16px;align-items:end}
.gate button{border-bottom:1px solid var(--accent);color:var(--accent)}
.err{color:var(--accent);min-height:1.4em;font-size:15px;margin:0}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-muted);display:grid;gap:4px}
footer a{color:var(--ink-muted)}
@media (max-width:640px){li{grid-template-columns:1fr}.s{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},
  lget(k){try{return localStorage.getItem(k)}catch(e){return null}},lset(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function setFont(f){document.documentElement.dataset.font=f;store.lset("rut-font",f);document.querySelectorAll(".sw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f))}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const p=PAYLOAD,enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(p.salt),iterations:p.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(p.iv)},key,b64(p.ct));
  return JSON.parse(new TextDecoder().decode(out));
}
function gate(){
  app.innerHTML=`<div class="gate"><h1>Рутенія: робочий індекс</h1><p class="lede">Вміст зашифровано. Введіть пароль.</p>
  <form id="g"><input type="password" id="pw" autocomplete="current-password" aria-label="Пароль" autofocus><button>Відкрити</button></form><p class="err" id="err" role="status"></p>
  <p class="lede"><a href="../" style="color:var(--accent)">Публічний індекс</a></p></div>`;
  document.getElementById("g").addEventListener("submit",async e=>{e.preventDefault();const pw=document.getElementById("pw").value;
    try{const d=await decrypt(pw);store.set("rut-pw",pw);render(d)}catch(x){document.getElementById("err").textContent="Пароль не підходить."}});
}
let tab,status="all",q="";
function render(D){
  const tabs=D.tabs.filter(([k])=>D.entries.some(e=>e.tab===k));
  tab=tab&&tabs.some(t=>t[0]===tab)?tab:(location.hash.slice(1)&&tabs.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):tabs[0][0]);
  const pub=LAYER==="public";
  app.innerHTML=`<header><h1>Рутенія: ${pub?"індекс ресурсів":"робочий індекс"}</h1>
   <p class="lede">${pub?"Публічні сторінки, шрифти й матеріали циклу «Рутенія» та #інфоВАРТА.":"Повний робочий індекс: сторінки Claude, репозиторії, шрифти, ілюстрації, джерела. ◆ — доступно лише власнику."} Оновлено ${esc(D.updated.split("-").reverse().join("."))}.</p>
   <div class="tools"><div class="sw" role="group" aria-label="Шрифт"><span class="lbl">Шрифт:</span>
     <button type="button" data-f="arial">Rutenia Arial</button><button type="button" data-f="rada">Ruthenia Rada Text</button></div>
     <div class="st" role="group" aria-label="Статус"><span class="lbl">Показати:</span>
     <button type="button" data-s="all">усе</button><button type="button" data-s="cur">без застарілих</button></div>
     <input type="search" id="q" placeholder="Пошук у всіх вкладках" aria-label="Пошук"></div></header>
   <nav role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${esc(l)}<small>${D.entries.filter(e=>e.tab===k).length}</small></button>`).join("")}</nav>
   <main id="list"></main>
   <footer><span>Шрифти: Rutenia Arial 2009, Ruthenia Rada, Ruthenia Rada Text © Василь Чебаник; Ruthenia Rada Text також Alina von Oertzen-Glairon, Angelika Kornienko. <a href="https://abetkarutenia.com.ua/">abetkarutenia.com.ua</a>, CC BY-SA 4.0.</span>
   <span>${pub?'<a href="r/">Робочий індекс</a> · ':'<a href="../">Публічний індекс</a> · '}#інфоВАРТА</span></footer>`;
  setFont(store.lget("rut-font")||"arial");
  document.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>setFont(b.dataset.f));
  const setS=()=>document.querySelectorAll(".st button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===status));
  document.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{status=b.dataset.s;setS();list(D)});setS();
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;history.replaceState(null,"","#"+tab);document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));list(D)});
  const qi=document.getElementById("q");qi.value=q;qi.oninput=()=>{q=qi.value.trim().toLowerCase();list(D)};
  list(D);
}
function row(e,showTab,D){
  const tl=showTab?D.tabs.find(t=>t[0]===e.tab)[1]:"";
  const live=e.status==="актуальна"||e.status==="остаточна";
  return `<li><a href="${esc(e.url)}" target="_blank" rel="noopener">${e.public?"":'<span class="lock" title="Лише власнику">◆ </span>'}${esc(e.title)}</a>
   <span class="s${live?" on":""}">${esc(e.status)}</span>
   <div class="m"><span>${esc(e.vyd)}</span><span>${esc(e.de)}</span>${e.date?`<span>${esc(e.date.split("-").reverse().join("."))}</span>`:""}${tl?`<span>${esc(tl)}</span>`:""}</div>
   ${e.note?`<p class="n">${esc(e.note)}</p>`:""}</li>`;
}
function list(D){
  let es=D.entries.filter(e=>status==="all"||e.status!=="застаріла");
  const L=document.getElementById("list");
  if(q){es=es.filter(e=>[e.title,e.note,e.url,e.de,e.vyd,e.group,e.status].join(" ").toLowerCase().includes(q));
    L.innerHTML=es.length?`<h2>Знайдено: ${es.length}</h2><ol>${es.map(e=>row(e,true,D)).join("")}</ol>`:'<p class="empty">Нічого не знайдено.</p>';return}
  es=es.filter(e=>e.tab===tab);
  const groups=[...new Set(es.map(e=>e.group||""))];
  L.innerHTML=es.length?groups.map(g=>`${g?`<h2>${esc(g)}</h2>`:""}<ol>${es.filter(e=>(e.group||"")===g).map(e=>row(e,false,D)).join("")}</ol>`).join(""):'<p class="empty">У цій вкладці нічого не показано.</p>';
}
if(LAYER==="public")render(PAYLOAD);
else{const pw=store.get("rut-pw");if(pw)decrypt(pw).then(render).catch(gate);else gate()}
</script>
